<div class="charts-grid" [class.duration-charts-hidden]="!showDurationCharts">
  <!-- Графік активності -->
  <app-activity-chart
    [activityChartData]="activityChartData"
    [selectedPeriod]="selectedPeriod"
    [isDarkTheme]="isDarkTheme"
    [filteredDomains]="filteredDomains">
  </app-activity-chart>
  
  <!-- Добова активність по тижнях -->
  <app-time-heatmap
    *ngIf="showDurationCharts && showPageTitles"
    [timeOfDayWeekHeatmapData]="timeOfDayWeekHeatmapData"
    [isDarkTheme]="isDarkTheme"
    [filteredDomains]="filteredDomains"
    [userStats]="userStats"
    [selectedPeriod]="selectedPeriod"
    [selectedDevice]="selectedDevice">
  </app-time-heatmap>

  <!-- Теплова карта активності за часом доби -->
  <app-activity-heatmap
    *ngIf="showDurationCharts && showPageTitles"
    [activityHeatmapData]="activityHeatmapData"
    [isDarkTheme]="isDarkTheme"
    [filteredDomains]="filteredDomains"
    [userStats]="userStats"
    [selectedPeriod]="selectedPeriod"
    [selectedDevice]="selectedDevice">
  </app-activity-heatmap>
  
  <!-- Кругова діаграма розподілу часу за категоріями -->
  <app-pie-chart
    *ngIf="showDurationCharts"
    [categoryDistributionData]="categoryDistributionData"
    [categoryLabels]="categoryLabels"
    [isDarkTheme]="isDarkTheme"
    [filteredDomains]="filteredDomains"
    [userStats]="userStats">
  </app-pie-chart>
  
  <!-- Бульбашкова діаграма -->
  <app-bubble-chart
   *ngIf="showDurationCharts"
    [bubbleChartData]="bubbleChartData"
    [scaleMode]="bubbleChartScaleMode"
    [isDarkTheme]="isDarkTheme"
    [filteredDomains]="filteredDomains"
    [userStats]="userStats"
    [sortedDomains]="sortedDomains"
    (scaleToggle)="onBubbleChartScaleToggle()">
  </app-bubble-chart>
  
  <!-- Топ сайтів -->
  <app-top-sites
    *ngIf="showPageTitles"
    [showDurationCharts]="showDurationCharts"
    [topDomainsData]="topDomainsData">
  </app-top-sites>
</div>
