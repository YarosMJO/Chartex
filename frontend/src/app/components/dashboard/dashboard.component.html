<div class="dashboard-container">
  <!-- Заголовок -->
  <mat-toolbar class="dashboard-header">
    <div class="header-content">
      <h1>{{ 'DASHBOARD.TITLE' | translate }}</h1>
      <div class="user-info" *ngIf="currentUser">
        <span>{{ 'DASHBOARD.WELCOME' | translate:{name: currentUser.displayName || currentUser.email} }}</span>
        <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-avatar-btn">
          <ng-container *ngIf="currentUser?.photoURL; else showIcon">
            <img [src]="currentUser.photoURL" [alt]="'HTML_ATTRIBUTES.GOOGLE_PROFILE_ALT' | translate" class="user-avatar" width="32" height="32" />
          </ng-container>
          <ng-template #showIcon>
            <mat-icon class="user-avatar-icon">account_circle</mat-icon>
          </ng-template>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="openSettings()">
            <mat-icon>settings</mat-icon>
            <span>{{ 'DASHBOARD.SETTINGS' | translate }}</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>{{ 'DASHBOARD.LOGOUT' | translate }}</span>
          </button>
        </mat-menu>
      </div>
      <button *ngIf="!currentUser" (click)="loginWithGoogle()" class="login-btn">
        {{ 'DASHBOARD.LOGIN_GOOGLE' | translate }}
      </button>
    </div>
  </mat-toolbar>

  <!-- Фільтри -->
  <app-filters-section
    [selectedPeriod]="selectedPeriod"
    [selectedDevice]="selectedDevice"
    [devices]="activeDevices"
    (periodChange)="onPeriodChange($event)"
    (deviceChange)="onDeviceChange($event)">
  </app-filters-section>

  <!-- Пошук -->
  <app-search-section
    [searchQuery]="searchQuery"
    [searchResults]="searchResults"
    [isSearching]="isSearching"
    [hasResults]="hasResults"
    (searchChange)="onSearchChange($event)"
    (clearSearch)="onClearSearch()">
  </app-search-section>

  <!-- Розширені фільтри -->
  <app-advanced-filters
    [filters]="advancedFilters"
    [availableCategories]="availableCategories"
    [isExpanded]="isAdvancedFiltersExpanded"
    (filtersChange)="onAdvancedFiltersChange($event)"
    (clearFilters)="onClearAdvancedFilters()">
  </app-advanced-filters>

  <!-- Помилка -->
  <div *ngIf="error" class="error-message">
    <mat-card>
      <mat-card-content>
        <div class="error-content">
          <mat-icon color="warn">error</mat-icon>
          <span>{{ error }}</span>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- Завантаження -->
  <div *ngIf="loading" class="loading-container">
    <mat-spinner></mat-spinner>
    <p>{{ 'DASHBOARD.LOADING' | translate }}</p>
  </div>

  <!-- Основний контент -->
  <div *ngIf="!loading && !error && userStats" class="dashboard-content">
    <!-- Статистика -->
    <app-stats-cards
      [userStats]="userStats"
      [devicesCount]="activeDevicesCount">
    </app-stats-cards>

    <!-- Графіки -->
    <app-charts-section
      [activityChartData]="activityChartData"
      [topDomainsData]="topDomainsData"
      [selectedPeriod]="getChartTitle()"
      [activityChartOptions]="activityChartOptions"
      [activityHeatmapData]="activityHeatmapData"
      [activityHeatmapOptions]="activityHeatmapOptions"
      [timeOfDayWeekHeatmapData]="timeOfDayWeekHeatmapData"
      [timeOfDayWeekHeatmapOptions]="timeOfDayWeekHeatmapOptions"
      [categoryDistributionData]="categoryDistributionData"
      [pieChartOptions]="pieChartOptions"
      [bubbleChartData]="bubbleChartData"
      [bubbleChartOptions]="bubbleChartOptions"
      [bubbleChartScaleMode]="bubbleChartScaleMode"
      (bubbleChartScaleToggle)="toggleBubbleChartScale()">
    </app-charts-section>

    <!-- Статистика пристроїв -->
    <app-devices-section
      [devices]="devices">
    </app-devices-section>
  </div>
</div>
