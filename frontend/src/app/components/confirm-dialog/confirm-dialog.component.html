<div class="confirm-dialog">
  <h2 mat-dialog-title>
    <mat-icon *ngIf="data.type === 'warning'" color="warn">warning</mat-icon>
    <mat-icon *ngIf="data.type === 'error'" color="warn">error</mat-icon>
    <mat-icon *ngIf="data.type === 'info'" color="primary">info</mat-icon>
    {{ data.title }}
  </h2>
  
  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>
  
  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">
      {{ data.cancelText || 'Скасувати' }}
    </button>
    <button 
      mat-raised-button 
      [color]="data.type === 'warning' || data.type === 'error' ? 'warn' : 'primary'"
      (click)="onConfirm()">
      {{ data.confirmText || 'Підтвердити' }}
    </button>
  </mat-dialog-actions>
</div>
