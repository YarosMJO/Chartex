<!DOCTYPE html>
<html>
<head>
    <title>Chartex Icon Generator</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        .icon-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .icon { 
            border: 1px solid #ccc; 
            padding: 10px; 
            text-align: center;
            background: #f5f5f5;
        }
        .icon16 { width: 16px; height: 16px; background: #2196F3; border-radius: 2px; }
        .icon48 { width: 48px; height: 48px; background: #2196F3; border-radius: 6px; }
        .icon128 { width: 128px; height: 128px; background: #2196F3; border-radius: 16px; }
        .icon-text { 
            position: relative; 
            color: white; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
    </style>
</head>
<body>
    <h1>Chartex Extension Icons</h1>
    <p>Зробіть скріншот кожної іконки та збережіть як PNG файл:</p>
    
    <div class="icon-container">
        <div class="icon">
            <div class="icon16 icon-text">C</div>
            <p>icon16.png</p>
        </div>
        <div class="icon">
            <div class="icon48 icon-text">C</div>
            <p>icon48.png</p>
        </div>
        <div class="icon">
            <div class="icon128 icon-text">C</div>
            <p>icon128.png</p>
        </div>
    </div>
    
    <p><strong>Інструкція:</strong></p>
    <ol>
        <li>Зробіть скріншот кожної іконки</li>
        <li>Збережіть як PNG файл з відповідною назвою</li>
        <li>Помістіть файли в папку extension/</li>
    </ol>
</body>
</html>
